<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>普通难度：首页信息样式</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #fffefd;
        --page: #f7f4ef;
        --ink: #292827;
        --muted: #777169;
        --quiet: #9b948b;
        --line: #ded8cf;
        --line-soft: #ebe6df;
        --accent: #6f6256;
        --accent-soft: #9b8f80;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 50% 0%, rgba(155, 143, 128, 0.1), transparent 38%),
          var(--page);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
        letter-spacing: 0;
      }

      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 14px;
      }

      .home-card {
        width: min(100%, 360px);
        min-height: 620px;
        display: flex;
        flex-direction: column;
        padding: 42px 28px 30px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--paper);
        box-shadow: 0 24px 60px rgba(58, 52, 45, 0.08);
      }

      .mark {
        width: 52px;
        height: 3px;
        margin-bottom: 38px;
        background: var(--accent);
      }

      h1 {
        margin: 0;
        font-size: 44px;
        line-height: 1.08;
        font-weight: 760;
      }

      .subtitle {
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 19px;
        line-height: 1.7;
        font-weight: 520;
      }

      .primary-lines {
        margin: 58px 0 0;
      }

      .primary-lines p,
      .secondary-lines p {
        margin: 0;
        font-size: 24px;
        line-height: 1.72;
        font-weight: 620;
      }

      .secondary-lines {
        margin: 34px 0 0;
      }

      .secondary-lines p {
        color: #4b4946;
      }

      .meta {
        margin-top: auto;
        padding-top: 42px;
      }

      .meta-line {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 10px;
        align-items: center;
        margin: 0;
        color: var(--quiet);
        font-size: 13px;
        line-height: 1.6;
      }

      .meta-line + .meta-line {
        margin-top: 8px;
      }

      .meta-line span {
        white-space: nowrap;
      }

      .meta-line span + span::before {
        content: "";
        display: inline-block;
        width: 3px;
        height: 3px;
        margin: 0 10px 3px 0;
        border-radius: 999px;
        background: color-mix(in srgb, var(--accent-soft) 58%, transparent);
      }

      .start-button {
        width: 100%;
        min-height: 52px;
        margin-top: 24px;
        border: 1px solid color-mix(in srgb, var(--accent) 36%, var(--line));
        border-radius: 10px;
        background: transparent;
        color: var(--accent);
        font: inherit;
        font-size: 18px;
        font-weight: 560;
      }

      .notes {
        max-width: 360px;
        margin: 22px auto 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }

      .notes strong {
        color: var(--accent);
        font-weight: 600;
      }

      @media (max-width: 380px) {
        main {
          align-items: stretch;
          padding: 12px;
        }

        .home-card {
          min-height: calc(100vh - 24px);
          padding: 34px 24px 26px;
        }

        h1 {
          font-size: 40px;
        }

        .primary-lines p,
        .secondary-lines p {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <section class="home-card" aria-labelledby="title">
          <div class="mark"></div>
          <h1 id="title">普通难度</h1>
          <p class="subtitle">一段普通生活记录。</p>

          <div class="primary-lines" aria-label="玩法">
            <p>读文字。</p>
            <p>做选择。</p>
            <p>继续。</p>
          </div>

          <div class="secondary-lines" aria-label="提示">
            <p>没有标准答案。</p>
            <p>只有之后发生的事。</p>
          </div>

          <div class="meta" aria-label="记录信息">
            <p class="meta-line">
              <span>无需登录</span>
              <span>建议竖屏</span>
            </p>
            <p class="meta-line">
              <span>序章 + 六章 + 终章</span>
              <span>约 10-15 分钟</span>
            </p>
            <p class="meta-line">
              <span>记录版本：2026.07.05</span>
            </p>
          </div>

          <button class="start-button" type="button">开始</button>
        </section>

        <p class="notes">
          <strong>样式说明：</strong>规模、时长和版本日期都压低到同一个信息区，保留可见性，但不抢走标题和开始按钮。
        </p>
      </div>
    </main>
  </body>
</html>
