<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>普通难度：回看交互示意</title>
    <style>
      :root {
        --page: #f7f4ef;
        --paper: #fffefd;
        --ink: #292827;
        --muted: #817b73;
        --quiet: #a19a91;
        --line: #ded8cf;
        --line-soft: #ebe6df;
        --accent: #7a6d5e;
        --surface: #f2ede6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgba(255, 255, 253, 0.86), rgba(247, 244, 239, 0.98)),
          var(--page);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
        letter-spacing: 0;
      }

      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 22px 14px;
      }

      .wrap {
        width: min(100%, 390px);
      }

      .game-card {
        min-height: 650px;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255, 255, 253, 0.94);
        box-shadow: 0 18px 48px rgba(47, 43, 36, 0.055);
        padding: 20px;
      }

      .mark {
        width: 42px;
        height: 2px;
        margin: 0 0 25px;
        background: var(--accent);
      }

      .eyebrow {
        margin: 0 0 7px;
        color: var(--accent);
        font-size: 0.82rem;
      }

      h1 {
        margin: 0;
        font-size: 1.42rem;
        line-height: 1.25;
      }

      .stat-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 5px 10px;
        margin: 13px 0 22px;
        color: #716b63;
        font-size: 0.76rem;
        line-height: 1.5;
      }

      .scene {
        margin: 0;
        color: #2b2b2a;
        font-size: 1.03rem;
        line-height: 1.9;
      }

      .choices,
      .result {
        margin-top: 27px;
      }

      .choices {
        display: grid;
        gap: 7px;
      }

      .choice-button {
        min-height: 40px;
        border: 1px solid color-mix(in srgb, var(--accent) 11%, #e7e2da);
        border-radius: 7px;
        background: rgba(255, 255, 253, 0.24);
        color: #45413b;
        padding: 8px 11px;
        text-align: left;
        font: inherit;
        font-size: 0.93rem;
      }

      .selected-choice {
        margin: 0 0 23px;
        color: #35322f;
        font-size: 0.97rem;
        line-height: 1.85;
      }

      .result-text {
        margin: 0;
        color: #3f3d39;
        font-size: 0.97rem;
        line-height: 1.82;
      }

      .aftermath {
        margin: 20px 0 0;
        color: #5f5a52;
        font-size: 0.94rem;
        line-height: 1.75;
      }

      .continue-button {
        width: 100%;
        min-height: 48px;
        margin-top: 28px;
        border: 1px solid #d5d0c7;
        border-radius: 8px;
        background: rgba(255, 255, 253, 0.62);
        color: #2f2e2b;
        padding: 12px 14px;
        text-align: center;
        font: inherit;
      }

      .history-nav {
        display: grid;
        gap: 8px;
        margin-top: auto;
        padding-top: 34px;
      }

      .history-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .history-button,
      .restart-button {
        border: 0;
        background: transparent;
        color: #8d857b;
        cursor: pointer;
        font: inherit;
        font-size: 0.78rem;
        line-height: 1.5;
        padding: 4px 2px;
      }

      .history-button:disabled {
        opacity: 0.34;
        cursor: default;
      }

      .history-button:hover:not(:disabled),
      .restart-button:hover {
        color: #5c554d;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .restart-row {
        text-align: center;
      }

      .restart-button {
        color: #a0988e;
      }

      .hint {
        margin: 18px 3px 0;
        color: #8f877d;
        font-size: 0.78rem;
        line-height: 1.65;
      }

      .debug {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        margin-top: 14px;
      }

      .debug span {
        border: 1px solid var(--line-soft);
        border-radius: 999px;
        padding: 5px 6px;
        color: #8d877f;
        font-size: 0.68rem;
        text-align: center;
      }

      .debug .active {
        border-color: color-mix(in srgb, var(--accent) 42%, var(--line));
        color: #4f463d;
        background: var(--surface);
      }

      @media (max-width: 380px) {
        main {
          align-items: stretch;
          padding: 12px;
        }

        .game-card {
          min-height: calc(100vh - 24px);
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="wrap">
        <section class="game-card" aria-live="polite">
          <div class="mark"></div>
          <p class="eyebrow" id="chapterLine"></p>
          <h1 id="title"></h1>
          <p class="stat-strip" id="stats"></p>
          <p class="scene" id="scene"></p>
          <div id="body"></div>
          <nav class="history-nav" aria-label="回看导航">
            <div class="history-row">
              <button class="history-button" type="button" id="prevButton">← 上一页</button>
              <button class="history-button" type="button" id="nextButton">下一页 →</button>
            </div>
            <div class="restart-row">
              <button class="restart-button" type="button">重新开始</button>
            </div>
          </nav>
        </section>

        <p class="hint">
          示意规则：底部导航一直显示，可以连续回看。回看只浏览已经发生过的页面，不回滚数值，也不允许改选。
        </p>
        <div class="debug" id="debug"></div>
      </div>
    </main>

    <script>
      const pages = [
        {
          type: "result",
          chapter: "第一章：筛选 · 1/3",
          title: "照片",
          stats: "信誉：紧张",
          scene: "申请表要求上传照片。你知道这不应该重要，但它在页面最上方，比经历和项目都更早出现。系统提示：资料越完整，处理越快。你停在上传按钮前，想了一会儿。",
          choice: "不上交",
          result: "系统停在未完成状态。你没有违反规则，只是流程多了一道门槛。",
          aftermath: "有些话开始需要多说一遍"
        },
        {
          type: "result",
          chapter: "第一章：筛选 · 2/3",
          title: "薪资",
          stats: "信誉：紧张",
          scene: "对方给出的数字比招聘页低。解释是“试用期先这样，后面看表现”。你需要这份工作，也知道这个数字会跟着你进入下一个月。",
          choice: "要求写进合同",
          result: "气氛从聊天变成了确认条款。你留下了依据，也让对方意识到你不只是点头。",
          aftermath: "这件事会留下来"
        },
        {
          type: "choice",
          chapter: "第一章：筛选 · 3/3",
          title: "等待",
          stats: "信誉：紧张",
          scene: "面试结束后，对方说会再联系。你走出楼，手机还在手里。电梯口很安静，你不知道刚才哪句话会被记住。",
          choices: ["发感谢消息", "等通知", "补一份材料"]
        }
      ];

      let currentIndex = pages.length - 1;
      let latestIndex = pages.length - 1;

      const chapterLine = document.querySelector("#chapterLine");
      const title = document.querySelector("#title");
      const stats = document.querySelector("#stats");
      const scene = document.querySelector("#scene");
      const body = document.querySelector("#body");
      const prevButton = document.querySelector("#prevButton");
      const nextButton = document.querySelector("#nextButton");
      const debug = document.querySelector("#debug");

      function renderDebug() {
        debug.innerHTML = pages
          .map((page, index) => `<span class="${index === currentIndex ? "active" : ""}">${page.title}</span>`)
          .join("");
      }

      function render() {
        const page = pages[currentIndex];
        const isReviewing = currentIndex < latestIndex;

        chapterLine.textContent = page.chapter;
        title.textContent = page.title;
        stats.textContent = page.stats;
        scene.textContent = page.scene;
        prevButton.disabled = currentIndex === 0;
        nextButton.disabled = currentIndex === latestIndex;

        if (page.type === "choice") {
          body.innerHTML = `
            <div class="choices">
              ${page.choices.map((choice) => `<button class="choice-button" type="button">${choice}</button>`).join("")}
            </div>
          `;
        } else {
          body.innerHTML = `
            <div class="result">
              <p class="selected-choice">[${page.choice}]</p>
              <p class="result-text">${page.result}</p>
              <p class="aftermath">（${page.aftermath}）</p>
              <button class="continue-button" type="button">继续</button>
            </div>
          `;
          body.querySelector(".continue-button").addEventListener("click", goForward);
        }

        renderDebug();
      }

      function goBack() {
        if (currentIndex > 0) {
          currentIndex -= 1;
          render();
        }
      }

      function goForward() {
        if (currentIndex < latestIndex) {
          currentIndex += 1;
          render();
        }
      }

      prevButton.addEventListener("click", goBack);
      nextButton.addEventListener("click", goForward);
      render();
    </script>
  </body>
</html>
