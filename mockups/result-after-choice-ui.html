<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>选择后页面样式模拟</title>
    <style>
      :root {
        color: #242321;
        background: #f8f7f4;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        line-height: 1.5;
        --chapter-primary: #7a6d5e;
        --chapter-surface: #f2ede6;
        --chapter-accent: #4f463d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(180deg, rgba(255, 255, 253, 0.9), rgba(248, 247, 244, 0.98)),
          #f8f7f4;
      }

      button {
        font: inherit;
      }

      .shell {
        width: min(100%, 390px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 18px 15px 26px;
        display: flex;
        align-items: center;
      }

      .card {
        width: 100%;
        border: 1px solid #e2ded6;
        border-radius: 8px;
        background: rgba(255, 255, 253, 0.94);
        padding: 21px 20px 20px;
        box-shadow: 0 12px 32px rgba(47, 43, 36, 0.045);
      }

      .card::before {
        content: "";
        display: block;
        width: 42px;
        height: 2px;
        margin-bottom: 18px;
        background: var(--chapter-primary);
      }

      .eyebrow {
        margin: 0 0 7px;
        color: var(--chapter-primary);
        font-size: 0.82rem;
      }

      h1 {
        margin: 0;
        color: #25221e;
        font-size: 1.38rem;
        font-weight: 650;
        line-height: 1.25;
        letter-spacing: 0;
      }

      .progress {
        display: flex;
        gap: 5px;
        margin: 18px 0 17px;
      }

      .dot {
        width: 4px;
        height: 4px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--chapter-primary) 18%, #ded9d0);
      }

      .dot.current {
        width: 14px;
        background: var(--chapter-primary);
      }

      .status {
        margin: 0 0 24px;
        color: #8d877e;
        font-size: 0.74rem;
        line-height: 1.5;
      }

      .scene {
        margin: 0;
        color: #292827;
        font-size: 1.03rem;
        line-height: 1.92;
      }

      .after {
        margin-top: 28px;
      }

      .selected {
        margin: 0 0 28px;
        color: #35322f;
        font-size: 0.97rem;
        line-height: 1.85;
        text-align: left;
      }

      .result {
        margin: 0;
        color: #35322f;
        font-size: 0.97rem;
        line-height: 1.85;
      }

      .aftermath {
        margin: 21px 0 0;
        color: #6a635a;
        font-size: 0.9rem;
        line-height: 1.75;
      }

      .continue {
        width: 100%;
        min-height: 45px;
        margin-top: 34px;
        border: 1px solid color-mix(in srgb, var(--chapter-primary) 16%, #d9d3ca);
        border-radius: 8px;
        background: rgba(255, 255, 253, 0.42);
        color: #35312d;
        padding: 10px 14px;
        text-align: center;
        font-size: 0.95rem;
        font-weight: 420;
      }

      .restart {
        display: block;
        margin: 25px auto 0;
        border: 0;
        background: transparent;
        color: #9a948b;
        padding: 4px 6px;
        font-size: 0.76rem;
      }

      .notes {
        width: min(100%, 390px);
        margin: 0 auto;
        padding: 0 15px 28px;
        color: #7d766d;
        font-size: 0.78rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-label="选择后页面样式模拟">
        <p class="eyebrow">第一章：筛选 · 1/3</p>
        <h1>照片</h1>

        <div class="progress" aria-label="当前关卡 1/3">
          <span class="dot current"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>

        <p class="status">信誉：紧张</p>

        <p class="scene">
          申请表要求上传照片。你知道这不应该重要，但它在页面最上方，比经历和项目都更早出现。系统提示：资料越完整，处理越快。你停在上传按钮前，想了一会儿。
        </p>

        <section class="after" aria-label="选择后的结果">
          <p class="selected">[不上传]</p>

          <p class="result">
            系统停在未完成状态。你没有违反规则，只是流程多了一道门槛。
          </p>

          <p class="aftermath">（有些话开始需要多说一遍。）</p>

          <button class="continue" type="button">继续</button>
          <button class="restart" type="button">重新开始</button>
        </section>
      </section>
    </main>

    <aside class="notes">
      这个 mock 只用于对比结果页视觉层级：选项用方括号标记为动作，余波句用圆括号标记为影响，继续按钮降低操作感。
    </aside>
  </body>
</html>
